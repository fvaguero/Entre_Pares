<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Tutor - Entre Pares</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- HEADER / NAVEGACIÓN -->
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="img/solo un cuaderno y un lapiz (2).png" alt="Logo" style="height:40px;">
            </a>
            <div class="auth-buttons">
                <!-- Menú de Roles (Se activa si el rol en localStorage es "Ambos") -->
                <div id="roleSwitcher" style="display: none; position: relative; margin-right: 1rem;">
                    <button id="btnRoleDropdown" class="btn" style="background-color: var(--primary-dark); color: white; padding: 0.5rem 1rem; font-size: 0.85rem;">
                        Modo Tutor ▼
                    </button>
                    <div id="dropdownMenu" style="display: none; position: absolute; right: 0; margin-top: 5px; width: 180px; background: white; border-radius: 8px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.05); z-index: 50; overflow: hidden;">
                        <a href="dashboard-estudiante.html" style="display: block; padding: 0.8rem 1rem; font-size: 0.85rem; color: var(--text-main); text-decoration: none;">Cambiar a Modo Estudiante</a>
                    </div>
                </div>
                
                <button id="btnCerrarSesion" class="btn" style="background-color: #fee2e2; color: #dc2626; padding: 0.5rem 1rem; font-size: 0.85rem;">Cerrar Sesión</button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="dashboard-single" style="margin: 2.5rem auto;">
        <div class="panel-card" style="margin-bottom: 2rem;">
            <h1 style="font-family: 'Inter', sans-serif; font-size: 1.5rem; margin-bottom: 0.5rem;">Panel de Gestión del Tutor</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Configura tu ciudad y las materias que dictas para aparecer en el mapa y en el directorio de estudiantes.</p>
        </div>

        <!-- Formulario para completar perfil de tutor -->
        <div class="panel-card card-tutor">
            <h3 style="margin-bottom: 1.2rem;">Completar Perfil Profesional</h3>
            
            <form id="formMaterias">
                <div class="form-group">
                    <label>Ciudad / Zona de Referencia</label>
                    <input type="text" id="ciudadTutor" class="form-control" placeholder="Ej: San Fernando del Valle de Catamarca" required>
                </div>
                
                <div class="form-group">
                    <label>Materias que imparto</label>
                    <input type="text" id="materias" class="form-control" placeholder="Ej: Álgebra I, Física, Programación" required>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.4rem;">Separá las materias con comas para facilitar la búsqueda.</p>
                </div>
                
                <button type="submit" class="btn btn-dark w-full" style="background-color: var(--primary-blue); color: white; margin-top: 1rem;">Guardar y Activar Perfil</button>
            </form>
            
            <p id="mensajeMaterias" class="mensaje" style="margin-top: 1rem; text-align: center; font-size: 0.9rem; font-weight: 500;"></p>
        </div>
    </main>

    <!-- Lógica externa de JavaScript -->
    <script src="dashboard-tutor.js"></script>
</body>
</html>
