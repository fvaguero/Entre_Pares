<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Entre Pares</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="img/solo un cuaderno y un lapiz (2).png" alt="Logo" style="height:50px;">
            </a>
            <div class="auth-buttons">
                <a href="login.html" class="btn-text">← Volver al login</a>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <h2>Recuperar Contraseña</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">
                Ingresá tu correo para recibir las instrucciones.
            </p>

            <form id="recoverForm">
                <div class="form-group">
                    <label>Correo Institucional</label>
                    <input type="email" id="email" class="form-control" placeholder="nombre@universidad.edu.ar" required>
                </div>
                <button type="submit" class="btn btn-dark w-full" style="margin-top: 1rem;">Enviar instrucciones</button>
            </form>

            <p id="mensaje" class="mensaje"></p>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://uecwotydamsjstpovbzz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qLu0E5bBdmeplXPNfE2UhA_VOuGhyC2';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('recoverForm');
        const mensaje = document.getElementById('mensaje');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            mensaje.textContent = "Enviando correo de recuperación...";
            mensaje.style.color = "var(--primary-blue)";

            // Supabase maneja el envío del mail automáticamente
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email);

            if (error) {
                mensaje.textContent = "Error: " + error.message;
                mensaje.style.color = "red";
            } else {
                mensaje.textContent = "¡Correo enviado! Revisá tu bandeja de entrada.";
                mensaje.style.color = "green";
                form.reset();
            }
        });
    </script>
</body>
</html>
