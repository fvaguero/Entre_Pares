<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <title>Recuperar Contraseña - Entre Pares</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="img/logo-cuaderno.png" alt="Logo" style="height:50px;">
            </a>
            <div class="auth-buttons">
                <a href="login.html" class="btn-text">← Volver al login</a>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <h2>Recuperar Contraseña</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">
                Ingresá tu correo para recibir las instrucciones.
            </p>

            <form id="recoverForm">
                <div class="form-group">
                    <label>Correo Institucional</label>
                    <input type="email" id="email" class="form-control" placeholder="nombre@universidad.edu.ar" required>
                </div>
                <button type="submit" class="btn btn-dark w-full" style="margin-top: 1rem;">Enviar instrucciones</button>
            </form>

            <p id="mensaje" class="mensaje"></p>
        </div>
    </main>
    <script src="js/recuperar.js"></script>

    <footer class="site-footer">
        <div class="footer-container">
            <p class="footer-title">Entre Pares — Red de Tutorías Académicas</p>
            <p class="footer-copy">© 2026 Todos los derechos reservados. Catamarca, Argentina.</p>
        </div>
    </footer>
</body>
</html>
