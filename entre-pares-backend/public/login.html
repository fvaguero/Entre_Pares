<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <title>Iniciar Sesión - Entre Pares</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo"><img src="img/logo-cuaderno.png" alt="Logo" style="height:50px;"></a>
            <div class="auth-buttons">
                <a href="registro.html" class="btn btn-yellow">Registrarme</a>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <h2>Bienvenido de nuevo</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Correo Institucional</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="nombre@universidad.edu.ar" required>
                </div>
                
                <div class="form-group">
                    <label>Contraseña</label>
                    <!-- CONTENEDOR DE CONTRASEÑA MODIFICADO -->
                    <div class="input-contenedor">
                        <!-- Ícono Avatar (Izquierda) -->
                        <span class="icono-izq">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required style="padding-left: 40px; padding-right: 40px;">
                        
                        <!-- Ícono Ojo (Derecha) -->
                        <span class="icono-der" id="togglePassword">
                            <svg id="iconoOjo" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </span>
                    </div>
                </div>
                
                <div style="text-align: right; margin-bottom: 1rem;">
                    <a href="recuperar.html" class="link text-sm">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-dark w-full">Ingresar</button>
            </form>
            
            <p id="loginMensaje" class="mensaje"></p>
            
            <p class="text-center mt-4 text-sm" style="color: var(--text-muted);">
                ¿No tenés cuenta? <a href="registro.html" class="link">Registrarme</a>
            </p>
        </div>
    </main>

    <script>
        // LÓGICA DEL OJO PARA MOSTRAR/OCULTAR CONTRASEÑA
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('loginPassword');
        const iconoOjo = document.getElementById('iconoOjo');

        if (togglePassword && passwordInput && iconoOjo) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);

                if (type === 'text') {
                    // Ojo abierto
                    iconoOjo.innerHTML = `
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    `;
                } else {
                    // Ojo tachado
                    iconoOjo.innerHTML = `
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    `;
                }
            });
        }

        // LÓGICA DE SUPABASE (SIN CAMBIOS)
        const SUPABASE_URL = 'https://uecwotydamsjstpovbzz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qLu0E5bBdmeplXPNfE2UhA_VOuGhyC2'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('loginForm');
        const loginMensaje = document.getElementById('loginMensaje');

        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('loginEmail').value.trim();
                const password = passwordInput.value;

                loginMensaje.textContent = "Iniciando sesión...";
                loginMensaje.style.color = "var(--primary-blue)";

                const { data: authData, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    loginMensaje.textContent = "Credenciales incorrectas: " + error.message;
                    loginMensaje.style.color = "red";
                    return;
                }

                loginMensaje.textContent = "¡Ingreso exitoso! Redirigiendo...";
                loginMensaje.style.color = "green";

                const userId = authData.user.id;
                let rol = authData.user.user_metadata?.rol;

                // 🔒 DOBLE SEGURIDAD
                if (email === 'valentinaseco2004@gmail.com') {
                    rol = 'Administrador';
                } else if (!rol) {
                    const { data: perfil } = await supabaseClient
                        .from('perfiles')
                        .select('rol')
                        .eq('id', userId)
                        .single();
                    if (perfil) rol = perfil.rol;
                }
                
                localStorage.setItem('usuarioId', userId);
                localStorage.setItem('usuarioRol', rol || 'Estudiante');
                
                setTimeout(() => {
                    if (rol === 'Administrador' || email === 'valentinaseco2004@gmail.com') {
                        window.location.href = 'admin.html';
                    } else if (rol === 'Ambos') {
                        window.location.href = 'dashboard-ambos.html';
                    } else if (rol === 'Tutor') {
                        window.location.href = 'dashboard-tutor.html';
                    } else {
                        window.location.href = 'dashboard-estudiante.html';
                    }
                }, 1000);
            });
        }
    </script>
    <footer class="site-footer">
        <div class="footer-container">
            <p class="footer-title">Entre Pares — Red de Tutorías Académicas</p>
            <p class="footer-copy">© 2026 Todos los derechos reservados. Catamarca, Argentina.</p>
        </div>
    </footer>
</body>
</html>
