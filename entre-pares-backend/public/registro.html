<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Entre Pares</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Estilos limpios para el autocompletado de la ciudad */
        .sugerencias-container {
            position: relative;
        }
        .sugerencias-lista {
            position: absolute;
            z-index: 20;
            width: 100%;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 5px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            list-style: none;
            padding: 0;
        }
        .sugerencias-lista li {
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }
        .sugerencias-lista li:last-child {
            border-bottom: none;
        }
        .sugerencias-lista li:hover {
            background-color: var(--bg-color);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="img/solo un cuaderno y un lapiz (2).png" alt="Logo" style="height:50px;">
            </a>
            <div class="auth-buttons">
                <a href="index.html" class="btn-text">← Volver al inicio</a>
            </div>
        </div>
    </header>

    <main class="auth-wrapper" style="margin: 2rem auto;">
        <div class="auth-card" style="max-width: 500px;">
            <h2>Creá tu cuenta</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">
                Usa tu correo institucional para registrarte
            </p>

            <form id="registerForm">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="nombre" class="form-control" required placeholder="Ej: María Gómez">
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>DNI</label>
                        <input type="text" id="dni" class="form-control" required placeholder="Ej: 40123456">
                    </div>
                    <div class="form-group">
                        <label>Fecha de Nacimiento</label>
                        <input type="date" id="fecha_nacimiento" class="form-control" required>
                    </div>
                </div>
                
                <div class="form-group sugerencias-container">
                    <label>Ciudad / Zona</label>
                    <input type="text" id="ciudad" class="form-control" required autocomplete="off" placeholder="Empezá a escribir tu ciudad...">
                    <ul id="sugerencias" class="sugerencias-lista"></ul>
                </div>

                <div class="form-group">
                    <label>Correo Institucional</label>
                    <input type="email" id="email" class="form-control" required placeholder="nombre@universidad.edu.ar">
                </div>
                
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                
                <div class="form-group">
                    <label>Rol en la plataforma</label>
                    <select id="rol" class="form-control">
                        <option value="Estudiante">Estudiante</option>
                        <option value="Tutor">Tutor Par</option>
                        <option value="Ambos">Ambos (Estudiante y Tutor)</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-dark w-full" style="margin-top: 1rem;">Registrarse</button>
            </form>

            <p id="mensaje" class="mensaje"></p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputCiudad = document.getElementById('ciudad');
            const listaSugerencias = document.getElementById('sugerencias');

            let timeoutId;
            if (inputCiudad) {
                inputCiudad.addEventListener('input', () => {
                    clearTimeout(timeoutId);
                    const query = inputCiudad.value;
                    if (query.length < 3) {
                        listaSugerencias.style.display = 'none';
                        return;
                    }

                    timeoutId = setTimeout(async () => {
                        try {
                            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=ar`);
                            const results = await res.json();

                            listaSugerencias.innerHTML = '';
                            if (results.length > 0) {
                                listaSugerencias.style.display = 'block';
                                results.forEach(place => {
                                    const li = document.createElement('li');
                                    li.textContent = place.display_name;
                                    li.addEventListener('click', () => {
                                        inputCiudad.value = place.display_name;
                                        listaSugerencias.style.display = 'none';
                                    });
                                    listaSugerencias.appendChild(li);
                                });
                            } else {
                                listaSugerencias.style.display = 'none';
                            }
                        } catch (err) {
                            console.error("Error buscando sugerencias:", err);
                        }
                    }, 300);
                });

                document.addEventListener('click', (e) => {
                    if (!inputCiudad.contains(e.target) && !listaSugerencias.contains(e.target)) {
                        listaSugerencias.style.display = 'none';
                    }
                });
            }

            const form = document.getElementById('registerForm');
            const mensaje = document.getElementById('mensaje');

            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const nombre = document.getElementById('nombre').value;
                    const dni = document.getElementById('dni').value;
                    const fecha_nacimiento = document.getElementById('fecha_nacimiento').value;
                    const ciudad = document.getElementById('ciudad').value;
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const rol = document.getElementById('rol').value;

                    mensaje.textContent = "Registrando usuario a través del servidor...";
                    mensaje.style.color = "var(--primary-blue)";

                    try {
                        const respuesta = await fetch('/api/auth/registro', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password, nombre, dni, fecha_nacimiento, ciudad, rol })
                        });

                        const resultado = await respuesta.json();

                        if (!resultado.success) {
                            mensaje.textContent = "Error: " + resultado.error;
                            mensaje.style.color = "red";
                            return;
                        }

                        mensaje.textContent = "¡Registro exitoso! Redirigiendo a tu panel...";
                        mensaje.style.color = "green";

                        localStorage.setItem('usuarioRol', rol);

                        setTimeout(() => {
                            if (rol === 'Tutor') {
                                window.location.href = 'dashboard-tutor.html';
                            } else if (rol === 'Ambos') {
                                window.location.href = 'dashboard-ambos.html';
                            } else {
                                window.location.href = 'dashboard-estudiante.html';
                            }
                        }, 1000);

                    } catch (err) {
                        console.error("Error en la petición:", err);
                        mensaje.textContent = "Error de conexión con el servidor.";
                        mensaje.style.color = "red";
                    }
                });
            }
        });
    </script>
</body>
</html>
